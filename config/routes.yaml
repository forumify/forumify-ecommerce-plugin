ecommerce_admin:
    resource: ../src/Admin/Controller
    type: attribute
    prefix: admin/ecommerce/
    name_prefix: ecommerce_admin_

ecommerce:
    resource: ../src/Controller
    type: attribute
    prefix: store
    trailing_slash_on_root: false
    name_prefix: ecommerce_

ecommerce_fake_payment:
    resource: ../src/PaymentProvider/Fake
    type: attribute
    prefix: store
    name_prefix: ecommerce_
    condition: "'%kernel.environment%' != 'prod'"
