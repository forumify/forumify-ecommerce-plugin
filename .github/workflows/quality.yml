name: Code Quality
on:
  push:
    branches:
      - 'master'
  pull_request:

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer

      - name: Install dependencies
        run: composer install --no-progress

      - name: Run PHP checks
        run: |
          ./vendor/bin/phpcs -s --standard=phpcs.xml
          ./vendor/bin/phpstan analyze -v
